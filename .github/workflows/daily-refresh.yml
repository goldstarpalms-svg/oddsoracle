name: daily-forebet-refresh

# Runs every morning at 05:00 UTC (06:00 WAT) — before the first European
# kickoff — re-pulls Forebet's daily pick tables for football, basketball and
# tennis, and commits fresh daily JSON files the site renders.
#
# Secrets (optional but recommended):
#   TELEGRAM_BOT_TOKEN  — bot token from @BotFather
#   TELEGRAM_CHAT_ID    — your chat id (send /start to the bot, then
#                         https://api.telegram.org/bot<TOKEN>/getUpdates)

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: pip install requests

      - name: Fetch Forebet daily picks (+ extra markets: HT, HT/FT, corners, cards, goalscorers)
        run: python3 backend/app/refresh_forebet.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Build HT / HT-FT / Asian-handicap model for every dated board
        run: python3 backend/app/halves.py

      - name: Build ODDSORACLE ENGINE (multi-model + Monte Carlo + EV + signal)
        run: python3 backend/app/oracle_engine.py

      - name: Score settled picks against ESPN official results
        run: python3 backend/app/score_espn.py

      - name: Rebuild track record (ROI / units / drawdown / calibration)
        run: python3 backend/app/backfill_history.py

      - name: Refresh bookmaker prices (OddsChecker, keyless, 25+ UK books)
        continue-on-error: true
        run: python3 backend/app/fetch_oddschecker.py

      # Pulse-Bet is a SEPARATE private repo (the engine). It reads this repo's
      # Forebet board + OddsChecker prices + historical CSVs, scores everything
      # with its Dixon-Coles model and writes <DATE>_pulse.json / <DATE>_arbs.json
      # back into backend/app/daily — which the snapshot step below then bundles.
      # Needs a PAT with read access to goldstarpalms-svg/pulse-bet.
      - name: Pulse-Bet enrichment (model probability, EV, tiers, Kelly, arbs)
        env:
          PULSE_SYNC_TOKEN: ${{ secrets.PULSE_SYNC_TOKEN }}
        run: |
          if [ -z "$PULSE_SYNC_TOKEN" ]; then
            echo "::warning::PULSE_SYNC_TOKEN not set — skipping Pulse-Bet enrichment"
            exit 0
          fi
          rm -rf pulse-bet
          git clone --depth 1 -q https://$PULSE_SYNC_TOKEN@github.com/goldstarpalms-svg/pulse-bet.git pulse-bet
          pip install --quiet pandas numpy scipy rapidfuzz
          (cd pulse-bet && python3 -m core.fusion.forebet_fusion --oddsoracle-dir .. --out ../backend/app/daily)
          rm -rf pulse-bet

      - name: Rebuild data snapshot (+ stamp FINAL scores of finished matches)
        run: |
          npm ci --no-audit --no-fund
          node scripts/bundle-data.mjs
          node scripts/fetch-final.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "oddsoracle-refresh"
          git config user.email "refresh@oddsoracle.bot"
          git add backend/app/daily backend/app/results lib/data-snapshot.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily forebet refresh + model halves + finals ($(date -u +%F))"
            git push
          fi
